<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/3da799223a.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Stream Overlay</title>
</head>
<body>
    <nav>
        <section class="categories">
            <ul>
            <li id="Ch1" class="s">
                <img src="images/Ch1.png" alt="">
            </li>
            <li id="Ch2" class="s">
                <img src="images/Ch2.png" alt="">
            </li>
            <li id="Ch3">
                <img src="images/Ch3.png" alt="">
            </li>
            <li id="Ch4">
                <img src="images/Ch4.png" alt="">
            </li>
            <li id="Ch5">
                <img src="images/Ch5.png" alt="">
            </li>
            <li id="Ch6">
                <img src="images/Ch6.png" alt="">
            </li>
            <li id="Ch7">
                <img src="images/Ch7.png" alt="">
            </li>
            <li id="Hdn">
                <img src="images/Hidden.png" alt="">
            </li>
            <li id="Wrd">
                <img src="images/Weird Route.png" alt="">
            </li>
        </ul>
        </section>
        <section class="color">
            <div id="colorSelection">
                From
                <input type="color" id="progbar-clr-l" value="#37dd16">
                to
                <input type="color" id="progbar-clr-r" value="#0870f8">
            </div>
            <ul class="colorspace">
                <li id="rgb" class="s">
                    <p>RGB</p>
                </li>
                <li id="hsl-longer">
                    <p>HSL Longer</p>
                </li>
                <li id="hsl-shorter">
                    <p>HSL Shorter</p>
                </li>
                <li id="lch">
                    <p>LCH</p>
                </li>
                <li id="oklch">
                    <p>OKLCH</p>
                </li>
                <li id="lab">
                    <p>LAB</p>
                </li>
                <li id="oklab">
                    <p>OKLAB</p>
                </li>
            </ul>
        </section>
    </nav>
    <p class="motifs"></p>
    <p class="dyk"></p>
    <main>
        <input type="range" id="volume" min="0" max="1" step="any" value=".5">
        <div class="progBar">
            <div class="overlay"></div>
        </div>
        <button id="newSongBtn" type="button"><i class="fa-solid fa-forward"></i></button>
        <button id="pauseBtn" type="button"><i class="fa-solid fa-pause"></i></button>
        <p class="curSong">Nothing is playing right now...</p>
        <button id="repeatBtn" type="button"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button id="optionsBtn" type="button"><i class="fa-solid fa-bars"></i></button>
    </main>
    
    <script type="module" src="script.js"></script>
</body>
</html>
